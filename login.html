<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmetro - Inicio de Sesión</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #f1f5f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 36px 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .brand-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0f172a;
        }
        .brand-header p {
            color: #64748b;
            font-size: 0.88rem;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #0f172a;
        }
        .hint-badge {
            background: #eff6ff;
            border: 1px solid #dbeafe;
            color: #1e40af;
            font-size: 0.78rem;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-submit {
            width: 100%;
            background-color: #0b132b;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #1c2541;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <h1>🚎 Transmetro</h1>
            <p>Municipalidad de Guatemala • Acceso Seguro</p>
        </div>

        <div class="hint-badge">
            ℹ️ <span>Modo Demo: Credenciales de administrador precargadas</span>
        </div>

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" value="admin" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" value="admin123" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>
    </div>

</body>
</html>
